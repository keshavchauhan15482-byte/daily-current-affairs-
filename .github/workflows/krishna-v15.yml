name: Krishna V15 Temporal Pilot

on:
  push:
    branches: [krishna-v15]
    paths:
      - 'krishna_v15/**'
      - '.github/workflows/krishna-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  xiiotid-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout isolated V15 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install audited runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'torch<2.7' 'kagglehub<0.4'

      - name: Run real-data temporal pilot
        run: |
          mkdir -p artifacts/v15
          python krishna_v15/v15_xiiotid_pilot.py 2>&1 | tee artifacts/v15/run.log

      - name: Show result report
        if: always()
        run: |
          test -f artifacts/v15/REPORT.md && cat artifacts/v15/REPORT.md || true
          test -f artifacts/v15/results.json && python -m json.tool artifacts/v15/results.json | tail -n 180 || true

      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krishna-v15-xiiotid-evidence
          path: artifacts/v15/
          if-no-files-found: warn
          retention-days: 30

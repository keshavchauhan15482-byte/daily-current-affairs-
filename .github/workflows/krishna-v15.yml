name: Krishna V15 GNN LSTM Pilot

on:
  push:
    branches: [krishna-v15]
    paths:
      - 'krishna_v15/**'
      - '.github/workflows/krishna-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  xiiotid-gnn-lstm:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout isolated V15 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audited runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'

      - name: Run GraphSAGE plus LSTM evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v15_gnn
          python krishna_v15/v15_xiiotid_gnn_lstm.py 2>&1 | tee artifacts/v15_gnn/run.log

      - name: Show GNN result report
        if: always()
        run: |
          test -f artifacts/v15_gnn/REPORT.md && cat artifacts/v15_gnn/REPORT.md || true
          test -f artifacts/v15_gnn/results.json && python -m json.tool artifacts/v15_gnn/results.json | tail -n 240 || true

      - name: Upload immutable GNN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krishna-v15-xiiotid-gnn-lstm-evidence
          path: artifacts/v15_gnn/
          if-no-files-found: warn
          retention-days: 30
